# Canonical actionlint configuration for intelligent-group/* repos.
# Source of truth: intelligent-group/.github/.github/actionlint.yaml
# https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# actionlint has no org-level config inheritance -- every consuming repo
# needs its own copy of this file at .github/actionlint.yaml. This copy was
# synced from the canonical source above (fleet actionlint normalization,
# 2026-07-08). If you need to add a label, add it there first, then re-sync.
#
# Label provenance (why each label is here -- do not prune without checking
# `grep -rn "runs-on" .github/workflows/` fleet-wide first; unused-but-listed
# labels are harmless, a used-but-missing label breaks the lint job):
self-hosted-runner:
  labels:
    # --- actively used in runs-on: today (verified 2026-07-08 fleet scan) ---
    - ig-self-hosted       # MIG (GPU-enabled cloud runner, ~$0.01/job amortized)
    - pc-cpu               # on-premises PC runner pool (preferred when online)
    - pc-ultra7-268v       # named PC box, used directly in ait-mailroom/runner-smoke.yml
    - aitbms-runner        # MIG subset label (qa-gate-47 dead-controls, added 2026-08-02)
    - ig-general           # renamed pool label (ait-claude-config#4709 phase 2/3; aitbms-runner kept until phase 3)
    - ig-ephemeral         # POSITIVE label carried ONLY by ephemeral one-job MIG/spot runners (never persistent boxes), for jobs that must not run on persistent infra (secret-scan waivers); see ait-claude-config infra/runner-fleet/ig-ephemeral-label-scope.json. Backfilled from the ait-claude-config copy: a re-sync from this file would otherwise drop it and break lint.
    - ig-multijob-canary   # carried ONLY by the multi-job (v41) canary runners on ig-org-runner-mig-small (RUNNER_EXTRA_LABELS metadata set by ait-claude-config infra/gh-runner-mig/multijob-canary.sh create-template); the cross-job leakage probe jobs in mig-recycle-proxy-eval.yml run-on it. Pool is size 0 at rest.
    - tier3-spot           # MIG spot runner, cost-optimized ephemeral compute for retry-tolerant Tier-3/nightly jobs. Already live in ait-crm's synced copy and used by ait-soc-sentinel#898 (qa-gate-13-broken-link.yml); backfilled here to stop the same drift this file's header warns about (gha-lib#38 tracks the opt-in pick-runner support).
    # --- legacy / reserved labels, not currently used in any runs-on: literal,
    #     kept for compatibility with ad-hoc extra_labels fan-outs
    #     (runner-cli-bootstrap.yml, runner-hygiene.yml) that can target these
    #     pool names dynamically. Safe to keep: an unused allowlist entry never
    #     fails the lint; only a used-but-missing one does. ---
    - mroot-self-hosted
    - mroot-self-hosted-small
    - ig-self-hosted-small
    - ig-self-hosted-priority
    - pc-ultra7-mruser
    - pc-ultra7-igorg
    - priority
    - org-wide
    - ig-org
    - ig-org-runner
    - mr-user
    # --- per-runner NAME labels (target one box at a time; used by
    #     runner-power-settings.yml's matrix). These landed in the
    #     ait-claude-config copy 2026-08-04 after that workflow broke
    #     actionlint on every PR, and were never synced back here --
    #     which is the drift this file's own header warns about. ---
    - gram-runner-1
    - gram-runner-2
    - gram2-1
    - gram2-2
    - samsung-runner-1
    - samsung-runner-2
    - pc-ultra7-igorg-orglevel
